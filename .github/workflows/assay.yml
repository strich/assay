name: assay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Pull request URL to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: assay-${{ github.event.pull_request.number || inputs.pr_url }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped: a review of a draft is noise the author did not ask for.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The workflow's installation token is a ghs_ token; assay's clone URL
      # uses x-access-token, which is the only basic-auth form GitHub accepts
      # for it. A PAT works the same way.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ASSAY_MAX_COST_USD: "2.0"
      ASSAY_MAX_DURATION_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Build assay
        run: go build -o bin/assay ./cmd/assay

      - name: Review the pull request
        env:
          PR_URL: ${{ github.event.pull_request.html_url || inputs.pr_url }}
          # runner.temp is only in scope at step level, not job-level env.
          ASSAY_WORKDIR: ${{ runner.temp }}/assay-work
        run: ./bin/assay --pr "$PR_URL"
